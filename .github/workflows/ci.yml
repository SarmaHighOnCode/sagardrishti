name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # A venv, not --system: the runner's interpreter is Debian
      # externally-managed and refuses --system installs, and --system would
      # target that interpreter rather than the 3.11 uv just installed.
      - run: uv python install 3.11
      - run: uv venv --python 3.11
      - run: uv pip install ruff pytest pytest-timeout

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # No Python sources exist yet (packages/ currently holds only READMEs).
      # pytest exits 5 on "no tests collected", which is not a failure while
      # the pipeline modules are unwritten. Self-activates once they land.
      - name: Test
        run: |
          set +e
          uv run pytest tests packages -v
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet — treating as pass."
            exit 0
          fi
          exit "$code"

  go:
    name: Go — vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Go data plane (aisd/aisgen/aiscodec) is not written yet. Run the
      # Go job only once a module exists, so this activates automatically on
      # the commit that adds it rather than failing every build until then.
      - id: detect
        run: |
          if [ -f packages/go/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No packages/go/go.mod yet — skipping Go job."
          fi

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version: "1.23"
          cache-dependency-path: packages/go/go.sum

      - run: go vet ./...
        if: steps.detect.outputs.present == 'true'
        working-directory: packages/go

      # The aiscodec round-trip test is what makes "synthetic and real AIS
      # share an ingest path" verifiable rather than aspirational.
      - run: go test ./... -v
        if: steps.detect.outputs.present == 'true'
        working-directory: packages/go

  aisd:
    name: aisd — vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/aisd/go.sum

      - run: go vet ./...
        working-directory: services/aisd

      # No live AISStream connection or Postgres needed here: the
      # WebSocket client is tested against an in-process fake server, and
      # the recorder against a fake DB - see internal/aisstream and
      # internal/recorder. That is what makes "reconnects with backoff"
      # and "never loses data on a DB outage" checked on every push
      # instead of only discovered live.
      - run: go test ./... -v
        working-directory: services/aisd

  web:
    name: Web — typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run lint
        working-directory: web

  guards:
    name: Project guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The design system has exactly one source of colour. The PDF dossier
      # generator reads the same tokens; drift between screen and export is a
      # credibility failure. See docs/DESIGN_SYSTEM.md section 9.
      - name: No hex colours outside tokens.css
        run: |
          # Test files are exempt: they pass literal colour strings as
          # fixtures to verify token-reading logic (e.g. "does this
          # function return the CSS custom property's value"), which is
          # not the same as a component hardcoding a colour instead of
          # reading a token.
          if grep -rEn '#[0-9a-fA-F]{6}\b' web/src --include='*.ts' --include='*.tsx' --include='*.css' \
             | grep -v 'styles/tokens.css' | grep -vE '\.test\.(ts|tsx):'; then
            echo "::error::Hex colour outside web/src/styles/tokens.css"
            exit 1
          fi

      # We rank. We never accuse. Product principle 1.
      #
      # Scans SOURCE only. Documentation is excluded on purpose: the docs
      # discuss this rule by quoting the forbidden words, and an earlier
      # version of this check failed on sagar_evidence/README.md stating
      # 'Never the word "guilty."' — the guard tripping on its own rule.
      - name: No accusatory language in user-facing strings
        run: |
          if grep -rniE '\b(guilty|culprit is|is responsible for the spill)\b' \
               --include='*.ts' --include='*.tsx' --include='*.py' --include='*.go' \
               web/src services packages 2>/dev/null; then
            echo "::error::Accusatory language found in source. The system ranks candidates."
            exit 1
          fi

      - name: No committed secrets or data
        run: |
          if git ls-files | grep -E '^\.env$' ; then
            echo "::error::Committed .env file"
            exit 1
          fi
          if git ls-files 'data/*' | grep -v '^data/README.md$' ; then
            echo "::error::Committed file under data/ — the data lake is git-ignored"
            exit 1
          fi
