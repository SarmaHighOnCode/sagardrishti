[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# Extended as pipeline packages land. services/api ships its own tests now;
# `tests/` and `packages/` are still empty (see .github/workflows/ci.yml's
# exit-5 tolerance), self-activating once M1-M7 packages exist.
testpaths = ["tests", "packages", "services/api/tests"]
